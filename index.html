    body {
        margin: 0;

<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
      }
    }
</script>

<script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'

    const scene = new THREE.Scene()
    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    )

    const renderer = new THREE.WebGLRenderer()
    renderer.setSize(window.innerWidth, window.innerHeight)
    document.body.appendChild(renderer.domElement)

    const controls = new OrbitControls(camera, renderer.domElement)

    const loader = new GLTFLoader();

    function loadModel(url){
        return new Promise((onLoad) => {
            loader.load(url,onLoad);
        });
    }

    // const model;
    // loader.load('https://raw.githubusercontent.com/MarcoSCaravetta/cv-game-website-materials/main/objects/player.glb', function (gltf){
    //     const model = gltf.scene;
    //     scene.add(model)
    //     model.position.set(0, -0.75, 0);
    // })
    const player = await loadModel('https://raw.githubusercontent.com/MarcoSCaravetta/cv-game-website-materials/main/objects/player.glb');
    player.scene.position.set(0, 0, 0);
    scene.add(player.scene);

    const geometry = new THREE.CylinderGeometry(0.25, 0.25, 1.5, 32)
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 })
    const cylinder = new THREE.Mesh(geometry, material)
    scene.add(cylinder)
    cylinder.position.set(1, 0, 0);

    const light = new THREE.AmbientLight( 0xA0A0A0 );
    scene.add( light );
    camera.position.z = 5
    camera.lookAt(scene.position);

    function animate() {
        requestAnimationFrame(animate)
        renderer.render(scene, camera)
        // cylinder.rotation.x += 0.1
        // cylinder.rotation.y += 0.1
        player.scene.rotation.x += 0.01
        // model.rotation.y += 0.01
    }

    animate()
</script>
