    body {
        margin: 0;

</style>

<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
      }
    }
</script>

<script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'

    const scene = new THREE.Scene()
    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    )

    const renderer = new THREE.WebGLRenderer()
    renderer.shadowMap.enabled = true;
    renderer.setSize(window.innerWidth, window.innerHeight)
    document.body.appendChild(renderer.domElement)

    const controls = new OrbitControls(camera, renderer.domElement)

    class ObjectScene extends THREE.Scene{
        constructor({sourceScene = null, width = 1, height = 1, depth = 1}) {
            super();
            if(sourceScene) {
                this.copyState(sourceScene)
            }
            // #TODO boudning box dimensions
            this.width = width;
            this.height = height;
            this.depth = depth;
            // #TODO velocity vector and phys engine
            this.velocity = {x: 0, y: 0, z: 0};
            this.gravity = -0.003
            // #TODO scale to passed dimensions
        }

        copyState(sourceScene) {
            this.matrixAutoUpdate = sourceScene.matrixAutoUpdate;
            this.up.copy(sourceScene.up);
            this.background = sourceScene.background;
            this.environment = sourceScene.environment;
            this.fog = sourceScene.fog;
            this.overrideMaterial = sourceScene.overrideMaterial;

            sourceScene.children.forEach(child => {
                this.add(child.clone());
            });
        }

        update(ground){
            // #TODO update to be bottom position with respect to gravity, regardless of orientation.
            // use physics engine and vectors for positioning and bounding box. Or use THREE.Box3 bounding box.
            this.bottom = this.position.y - this.height/2;

            this.applyGravity(ground);


        }

        applyGravity(ground){
            // #TODO use physics engine
            this.velocity.y += this.gravity;

            if (this.bottom + this.velocity.y <= ground.top) {
                this.velocity.y *= 0.3;
                this.velocity.y = -this.velocity.y;
            }
            else this.position.y += this.velocity.y;
        }
    }

    class Box extends THREE.Mesh {
        constructor({width = 1, height = 1, depth = 1, color = 0x00ff00}) {
            super(
                new THREE.BoxGeometry(width, height, depth),
                new THREE.MeshStandardMaterial({color})
            )

            this.width = width
            this.height = height
            this.depth = depth
            this.velocity = {x: 0, y: 0, z: 0};
        }

        update(){
            this.bottom = this.position.y - this.height/2;
            this.top = this.position.y + this.height/2;

            this.position.y += this.velocity.y
        }
    }

    const loader = new GLTFLoader();

    async function loadModel(url){
        const glb = await loader.loadAsync(url);
        return glb.scene;
    };

    const player = new ObjectScene({
        sourceScene: await loadModel('https://raw.githubusercontent.com/MarcoSCaravetta/cv-game-website-materials/main/objects/player.glb'),
        width: 0.3,
        height: 1.52,
        depth: 0.3,
    });
    player.position.set(0, 0, 0);
    player.velocity.y = -0.01
    // #TODO iterable functions passed to traverse. Where to put them?
    player.traverse(function(node) {
        if(node.isMesh)
            node.castShadow = true;
    })
    scene.add(player);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 3, 2);
    light.castShadow = true;
    scene.add(light);
    const ambient_light = new THREE.AmbientLight(0xA0A0A0);
    //scene.add(ambient_light)

    // const cylinder = new THREE.Mesh(
    //     new THREE.CylinderGeometry(0.25, 0.25, 1.5, 32), 
    //     new THREE.MeshStandardMaterial({color: 0x00ff00})
    // );
    // cylinder.position.set(1, 0, 0);
    // cylinder.castShadow = true;
    // scene.add(cylinder)

    const ground = new Box({
        width: 5, 
        height: 0.5,
        depth: 10,
        color: 0x0000ff
    });
    ground.position.y = -2;
    ground.receiveShadow = true;
    scene.add(ground)

    camera.position.z = 5
    camera.lookAt(scene.position);

    player.update(ground);
    ground.update();
    console.log(player.bottom) // #TODO for debug only
    console.log(ground.top)

    function animate() {
        requestAnimationFrame(animate)
        renderer.render(scene, camera)
        player.update(ground);
        // player.rotation.x += 0.01
        // player.rotation.y += 0.01
    }

    // #TODO use delta time in frame animation for consistenet movement
    animate()
</script>
